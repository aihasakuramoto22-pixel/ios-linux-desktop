name: Build unsigned IPA
on: [push, workflow_dispatch]
jobs:
  ipa:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Fetch iSH (GPL-3.0) source
        run: git clone --recursive --depth 1 https://github.com/ish-app/ish.git ish
      - name: Tools
        run: brew install llvm lld ninja libarchive meson
      - name: Build (no signing)
        working-directory: ish
        run: |
          xcodebuild -project iSH.xcodeproj -scheme iSH -configuration Release \
            -arch arm64 -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: Package IPA
        run: |
          APP=$(find ish/build/Build/Products -name '*.app' -maxdepth 2 | head -1)
          mkdir Payload && cp -R "$APP" Payload/ && cp scripts/desktop-setup.sh Payload/*.app/ || true
          zip -qry LinuxDesktop-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with: { name: LinuxDesktop-unsigned-ipa, path: LinuxDesktop-unsigned.ipa }
